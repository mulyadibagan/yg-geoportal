name: RSPO tree-cover monitoring

on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 15 */3 *"
  push:
    paths:
      - "scripts/build_rspo_tree_cover_monitoring.py"
      - "scripts/build_forest_analytics.py"
      - "data/PERUSAHAAN_SAWIT_RIAU_REFERENSI.geojson"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pyproj rasterio shapely
      - run: python scripts/build_rspo_tree_cover_monitoring.py
      - name: Publish updated monitoring data
        run: |
          git config user.name "YG GeoPortal Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rspo-tree-cover-monitoring.json
          git diff --cached --quiet || git commit -m "Update RSPO tree-cover monitoring"
          git push
