name: Publish Cloudflare staging snapshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/dashboard-summary-snapshot.json'
      - 'data/master-database-snapshot.json'
      - 'cloudflare/yg-webgis-public-data/**'
      - '.github/workflows/publish-cloudflare-snapshots.yml'

permissions:
  contents: read

concurrency:
  group: yg-webgis-cloudflare-staging
  cancel-in-progress: false

jobs:
  publish-staging:
    runs-on: ubuntu-latest
    environment: yg-webgis-staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/yg-webgis-public-data/package-lock.json
      - run: npm ci
        working-directory: cloudflare/yg-webgis-public-data
      - run: npm test
        working-directory: cloudflare/yg-webgis-public-data
      - run: npm run validate:snapshots
        working-directory: cloudflare/yg-webgis-public-data
      - name: Upload versioned and current snapshots
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SNAPSHOT_VERSION: ${{ github.sha }}
        run: |
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/snapshots/${SNAPSHOT_VERSION}/dashboard.json" --remote --file ../../data/dashboard-summary-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/snapshots/${SNAPSHOT_VERSION}/objects.json" --remote --file ../../data/master-database-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/snapshots/current/dashboard.json" --remote --file ../../data/dashboard-summary-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/snapshots/current/objects.json" --remote --file ../../data/master-database-snapshot.json --content-type application/json
      - name: Build and upload manifest last
        shell: bash
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SNAPSHOT_VERSION: ${{ github.sha }}
        run: |
          node scripts/build-manifest.mjs "$SNAPSHOT_VERSION"
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/manifests/${SNAPSHOT_VERSION}.json" --remote --file tmp/current-manifest.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/manifests/current.json" --remote --file tmp/current-manifest.json --content-type application/json
      - name: Deploy staging Worker
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Smoke test staging gateway
        working-directory: cloudflare/yg-webgis-public-data
        run: npm run smoke:staging
