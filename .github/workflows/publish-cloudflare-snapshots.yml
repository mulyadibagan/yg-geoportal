name: Publish Cloudflare snapshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/dashboard-summary-snapshot.json'
      - 'data/master-database-snapshot.json'
      - 'data/kph_2019_riau.geojson'
      - 'data/liberica-morphology-2026.json'
      - 'data/dayun-program.json'
      - 'data/dayun-map.geojson'
      - 'data/dayun-context.geojson'
      - 'data/dayun-gawangan-details.json'
      - 'data/dayun-blocks.geojson'
      - 'cloudflare/yg-webgis-public-data/**'
      - '.github/workflows/publish-cloudflare-snapshots.yml'
  workflow_run:
    workflows:
      - Update Master Database snapshot
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: yg-webgis-cloudflare-staging
  cancel-in-progress: false

jobs:
  publish-staging:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: yg-webgis-staging
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Resolve published snapshot version
        shell: bash
        run: echo "SNAPSHOT_VERSION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Stamp Dayun data update time
        shell: bash
        run: |
          export DAYUN_UPDATED_AT="$(git log -1 --format=%cI -- data/dayun-gawangan-details.json)"
          node -e "const fs=require('fs');const path='data/dayun-gawangan-details.json';const data=JSON.parse(fs.readFileSync(path,'utf8'));data.updatedAt=process.env.DAYUN_UPDATED_AT;fs.writeFileSync(path,JSON.stringify(data,null,2)+'\\n');"
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/yg-webgis-public-data/package-lock.json
      - run: npm ci
        working-directory: cloudflare/yg-webgis-public-data
      - run: npm test
        working-directory: cloudflare/yg-webgis-public-data
      - run: npm run validate:snapshots
        working-directory: cloudflare/yg-webgis-public-data
      - name: Validate optional internal RTRW working layer
        if: ${{ hashFiles('private-data/rtrw-riau-2018-2038.geojson') != '' }}
        run: npm run validate:rtrw -- ../../private-data/rtrw-riau-2018-2038.geojson
        working-directory: cloudflare/yg-webgis-public-data
      - name: Build private RSPO organisation overview
        run: npm run build:rspo-groups
        working-directory: cloudflare/yg-webgis-public-data
      - name: Upload versioned and current snapshots
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/snapshots/${SNAPSHOT_VERSION}/dashboard.json" --remote --file ../../data/dashboard-summary-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/snapshots/${SNAPSHOT_VERSION}/objects.json" --remote --file ../../data/master-database-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/snapshots/current/dashboard.json" --remote --file ../../data/dashboard-summary-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/snapshots/current/objects.json" --remote --file ../../data/master-database-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots/snapshots/${SNAPSHOT_VERSION}/dashboard.json" --remote --file ../../data/dashboard-summary-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots/snapshots/${SNAPSHOT_VERSION}/objects.json" --remote --file ../../data/master-database-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots/snapshots/current/dashboard.json" --remote --file ../../data/dashboard-summary-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots/snapshots/current/objects.json" --remote --file ../../data/master-database-snapshot.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/references/kph_2019_riau.geojson" --remote --file ../../data/kph_2019_riau.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots/references/kph_2019_riau.geojson" --remote --file ../../data/kph_2019_riau.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/research/liberica-morphology-2026.json" --remote --file ../../data/liberica-morphology-2026.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots/research/liberica-morphology-2026.json" --remote --file ../../data/liberica-morphology-2026.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/internal/rspo/riau-companies.geojson" --remote --file tmp/rspo-riau-companies.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots/internal/rspo/riau-companies.geojson" --remote --file tmp/rspo-riau-companies.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/internal/rspo/riau-groups.geojson" --remote --file tmp/rspo-riau-groups.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots/internal/rspo/riau-groups.geojson" --remote --file tmp/rspo-riau-groups.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/references/rspo-riau-groups.geojson" --remote --file ../../data/PERUSAHAAN_SAWIT_RIAU_REFERENSI.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots/references/rspo-riau-groups.geojson" --remote --file ../../data/PERUSAHAAN_SAWIT_RIAU_REFERENSI.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/dayun/program.json" --remote --file ../../data/dayun-program.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/dayun/map.geojson" --remote --file ../../data/dayun-map.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/dayun/context.geojson" --remote --file ../../data/dayun-context.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/dayun/gawangan-details.json" --remote --file ../../data/dayun-gawangan-details.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/dayun/blocks.geojson" --remote --file ../../data/dayun-blocks.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots/dayun/program.json" --remote --file ../../data/dayun-program.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots/dayun/map.geojson" --remote --file ../../data/dayun-map.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots/dayun/context.geojson" --remote --file ../../data/dayun-context.geojson --content-type application/geo+json
          npx wrangler r2 object put "yg-webgis-public-snapshots/dayun/gawangan-details.json" --remote --file ../../data/dayun-gawangan-details.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots/dayun/blocks.geojson" --remote --file ../../data/dayun-blocks.geojson --content-type application/geo+json
      - name: Build and upload manifest last
        shell: bash
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/build-manifest.mjs "$SNAPSHOT_VERSION"
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/manifests/${SNAPSHOT_VERSION}.json" --remote --file tmp/current-manifest.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots-staging/manifests/current.json" --remote --file tmp/current-manifest.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots/manifests/${SNAPSHOT_VERSION}.json" --remote --file tmp/current-manifest.json --content-type application/json
          npx wrangler r2 object put "yg-webgis-public-snapshots/manifests/current.json" --remote --file tmp/current-manifest.json --content-type application/json
      - name: Deploy staging Worker
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: Deploy production Worker
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
      - name: Smoke test staging gateway
        working-directory: cloudflare/yg-webgis-public-data
        run: npm run smoke:staging
