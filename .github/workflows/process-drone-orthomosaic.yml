name: Process drone orthomosaic

# Queue processor: push to this file can be used to start a pending job immediately.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/process-drone-orthomosaic.yml'
      - 'scripts/drone_job.py'

permissions:
  contents: read

concurrency:
  group: yg-drone-orthomosaic-processor
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    environment: yg-webgis-staging
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/yg-webgis-public-data/package-lock.json
      - run: npm ci
        working-directory: cloudflare/yg-webgis-public-data
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install 'gdown>=6.0.0'
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl jq gdal-bin
      - name: Read pending queue
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p ../../tmp/drone
          npx wrangler r2 object get "yg-webgis-public-snapshots/drone/queue/pending.json" --remote --file ../../tmp/drone/pending.json || echo '{"jobs":[]}' > ../../tmp/drone/pending.json
          cat ../../tmp/drone/pending.json
      - name: Process first pending job
        id: process_job
        shell: bash
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          JOB_ID=$(jq -r '.jobs[0] // empty' ../../tmp/drone/pending.json)
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$JOB_ID" ]; then
            echo "No pending drone jobs"
            exit 0
          fi
          ROOT="../../tmp/drone/$JOB_ID"
          mkdir -p "$ROOT/input" "$ROOT/output" "$ROOT/project/images" "$ROOT/rejected"
          npx wrangler r2 object get "yg-webgis-public-snapshots/drone/jobs/$JOB_ID.json" --remote --file "$ROOT/job.json"

          publish_status() {
            npx wrangler r2 object put "yg-webgis-public-snapshots/drone/jobs/$JOB_ID.json" --remote --file "$ROOT/job.json" --content-type application/json
          }

          python ../../scripts/drone_job.py processing "$ROOT/job.json"
          publish_status

          python ../../scripts/drone_job.py stage "$ROOT/job.json" downloading 15 "Mengambil foto"
          publish_status
          SOURCE=$(jq -r '.sourceType' "$ROOT/job.json")
          if [ "$SOURCE" = "drive" ]; then
            DRIVE_URL=$(jq -r '.driveUrl' "$ROOT/job.json")
            gdown --folder "$DRIVE_URL" -O "$ROOT/input"
          else
            jq -r '.files[]?.key' "$ROOT/job.json" | while read -r KEY; do
              [ -z "$KEY" ] && continue
              NAME=$(basename "$KEY")
              npx wrangler r2 object get "yg-webgis-public-snapshots/$KEY" --remote --file "$ROOT/input/$NAME"
            done
          fi

          python ../../scripts/drone_job.py stage "$ROOT/job.json" checking 30 "Memeriksa kualitas dan metadata foto"
          publish_status
          python ../../scripts/drone_job.py qc "$ROOT/input" "$ROOT/rejected" "$ROOT/valid.txt" "$ROOT/qc.json"
          python ../../scripts/drone_job.py metadata "$ROOT/job.json" "$ROOT/qc.json"
          publish_status
          VALID=$(jq -r '.validPhotos' "$ROOT/qc.json")
          REJECTED=$(jq -r '.excludedPhotos' "$ROOT/qc.json")
          if [ "$VALID" -lt 3 ]; then
            echo "Not enough valid nadir photos" >&2
            exit 22
          fi

          python ../../scripts/drone_job.py stage "$ROOT/job.json" preparing 45 "Menyiapkan foto terpilih" --valid "$VALID" --excluded "$REJECTED"
          publish_status
          while IFS= read -r IMG; do cp "$IMG" "$ROOT/project/images/"; done < "$ROOT/valid.txt"

          python ../../scripts/drone_job.py stage "$ROOT/job.json" reconstructing 55 "Menyusun posisi dan kecocokan foto" --valid "$VALID" --excluded "$REJECTED"
          publish_status
          docker pull opendronemap/odm:latest
          docker run --rm -v "$(realpath "$ROOT"):/datasets" opendronemap/odm:latest \
            --project-path /datasets project \
            --orthophoto-resolution 3 \
            --feature-quality medium \
            --pc-quality medium \
            --skip-3dmodel \
            --skip-report

          TIF="$ROOT/project/odm_orthophoto/odm_orthophoto.tif"
          [ -f "$TIF" ] || { echo "ODM did not create orthophoto" >&2; exit 23; }

          python ../../scripts/drone_job.py stage "$ROOT/job.json" orthomosaic 80 "Membuat orthomosaic" --valid "$VALID" --excluded "$REJECTED"
          publish_status

          python ../../scripts/drone_job.py stage "$ROOT/job.json" optimizing 90 "Menyiapkan hasil untuk peta" --valid "$VALID" --excluded "$REJECTED"
          publish_status
          gdal_translate "$TIF" "$ROOT/output/orthomosaic.cog.tif" -of COG -co COMPRESS=JPEG -co QUALITY=88 -co BIGTIFF=IF_SAFER -co OVERVIEWS=AUTO
          gdalinfo -json "$ROOT/output/orthomosaic.cog.tif" > "$ROOT/output/gdalinfo.json"

          python ../../scripts/drone_job.py stage "$ROOT/job.json" saving 95 "Menyimpan hasil" --valid "$VALID" --excluded "$REJECTED"
          publish_status
          npx wrangler r2 object put "yg-webgis-public-snapshots/drone/results/$JOB_ID/orthomosaic.cog.tif" --remote --file "$ROOT/output/orthomosaic.cog.tif" --content-type image/tiff

          python ../../scripts/drone_job.py ready "$ROOT/job.json" "$ROOT/output/gdalinfo.json" "$ROOT/qc.json"
          publish_status

          jq --arg id "$JOB_ID" '.jobs = (.jobs | map(select(. != $id)))' ../../tmp/drone/pending.json > ../../tmp/drone/pending.next.json
          mv ../../tmp/drone/pending.next.json ../../tmp/drone/pending.json
          npx wrangler r2 object put "yg-webgis-public-snapshots/drone/queue/pending.json" --remote --file ../../tmp/drone/pending.json --content-type application/json
      - name: Mark failed job
        if: failure() && steps.process_job.outputs.job_id != ''
        shell: bash
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          JOB_ID: ${{ steps.process_job.outputs.job_id }}
        run: |
          ROOT="../../tmp/drone/$JOB_ID"
          if [ -f "$ROOT/job.json" ]; then
            python ../../scripts/drone_job.py failed "$ROOT/job.json" --error processing_failed
            npx wrangler r2 object put "yg-webgis-public-snapshots/drone/jobs/$JOB_ID.json" --remote --file "$ROOT/job.json" --content-type application/json || true
          fi
          if [ -f ../../tmp/drone/pending.json ]; then
            jq --arg id "$JOB_ID" '.jobs = (.jobs | map(select(. != $id)))' ../../tmp/drone/pending.json > ../../tmp/drone/pending.next.json || true
            [ -f ../../tmp/drone/pending.next.json ] && npx wrangler r2 object put "yg-webgis-public-snapshots/drone/queue/pending.json" --remote --file ../../tmp/drone/pending.next.json --content-type application/json || true
          fi
