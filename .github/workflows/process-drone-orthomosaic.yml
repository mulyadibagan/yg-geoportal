name: Process drone orthomosaic

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/process-drone-orthomosaic.yml'
      - 'scripts/drone_job.py'
      - 'scripts/download_drive_folder.py'

permissions:
  contents: read

concurrency:
  group: yg-drone-orthomosaic-processor
  # A processor-code push must replace an older running implementation.
  # Scheduled polling must never cancel a long photogrammetry job.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  process:
    runs-on: ubuntu-latest
    environment: yg-webgis-staging
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/yg-webgis-public-data/package-lock.json
      - run: npm ci
        working-directory: cloudflare/yg-webgis-public-data
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install 'gdown>=6.3.0'
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl jq gdal-bin
      - name: Clean expired drone source files
        shell: bash
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DRONE_API_BASE: https://yg-webgis-public-data.yg-webgis-public-data-worker.workers.dev
        run: |
          set -euo pipefail
          CLEANUP_ROOT="../../tmp/drone-cleanup"
          CLEANUP_QUEUE="$CLEANUP_ROOT/cleanup.json"
          CLEANUP_NEXT="$CLEANUP_ROOT/cleanup.next.json"
          mkdir -p "$CLEANUP_ROOT/jobs"
          npx wrangler r2 object get "yg-webgis-public-snapshots/drone/queue/cleanup.json" --remote --file "$CLEANUP_QUEUE" || echo '{"jobs":[]}' > "$CLEANUP_QUEUE"

          # Reconcile published results created before cleanup scheduling existed.
          # This only queues temporary R2 sources; Google Drive is never modified.
          PUBLIC_CATALOG="$CLEANUP_ROOT/public.json"
          curl --fail --silent --show-error "$DRONE_API_BASE/api/drone/public" > "$PUBLIC_CATALOG"
          while IFS= read -r LEGACY_JOB_ID; do
            [ -z "$LEGACY_JOB_ID" ] && continue
            if jq -e --arg id "$LEGACY_JOB_ID" '.jobs[]? | select(.id == $id)' "$CLEANUP_QUEUE" >/dev/null; then
              continue
            fi
            LEGACY_JOB_FILE="$CLEANUP_ROOT/jobs/$LEGACY_JOB_ID.json"
            if ! npx wrangler r2 object get "yg-webgis-public-snapshots/drone/jobs/$LEGACY_JOB_ID.json" --remote --file "$LEGACY_JOB_FILE" >/dev/null 2>&1; then
              continue
            fi
            LEGACY_STATUS=$(jq -r '.status // empty' "$LEGACY_JOB_FILE")
            LEGACY_COG=$(jq -r '.cogKey // empty' "$LEGACY_JOB_FILE")
            LEGACY_CLEANUP=$(jq -r '.r2CleanupStatus // empty' "$LEGACY_JOB_FILE")
            if [ "$LEGACY_STATUS" != "ready" ] || [ -z "$LEGACY_COG" ] || [ "$LEGACY_CLEANUP" = "complete" ]; then
              continue
            fi
            if [ "$LEGACY_CLEANUP" != "scheduled" ]; then
              python ../../scripts/drone_job.py cleanup-scheduled "$LEGACY_JOB_FILE" --days 7
              npx wrangler r2 object put "yg-webgis-public-snapshots/drone/jobs/$LEGACY_JOB_ID.json" --remote --file "$LEGACY_JOB_FILE" --content-type application/json
            fi
            LEGACY_ELIGIBLE=$(jq -r '.r2CleanupEligibleAt // empty' "$LEGACY_JOB_FILE")
            [ -z "$LEGACY_ELIGIBLE" ] && continue
            jq --arg id "$LEGACY_JOB_ID" --arg eligibleAt "$LEGACY_ELIGIBLE" \
              '.jobs = ((.jobs // []) + [{id:$id,eligibleAt:$eligibleAt}] | unique_by(.id))' \
              "$CLEANUP_QUEUE" > "$CLEANUP_QUEUE.tmp"
            mv "$CLEANUP_QUEUE.tmp" "$CLEANUP_QUEUE"
            echo "Scheduled temporary R2 cleanup for existing result $LEGACY_JOB_ID"
          done < <(jq -r '.items[]?.id // empty' "$PUBLIC_CATALOG")

          echo '{"jobs":[]}' > "$CLEANUP_NEXT"

          keep_cleanup() {
            local item="$1"
            jq --argjson item "$item" '.jobs += [$item]' "$CLEANUP_NEXT" > "$CLEANUP_NEXT.tmp"
            mv "$CLEANUP_NEXT.tmp" "$CLEANUP_NEXT"
          }

          while IFS= read -r ITEM; do
            [ -z "$ITEM" ] && continue
            JOB_ID=$(jq -r '.id // empty' <<< "$ITEM")
            ELIGIBLE_AT=$(jq -r '.eligibleAt // empty' <<< "$ITEM")
            if [ -z "$JOB_ID" ] || [ -z "$ELIGIBLE_AT" ]; then
              continue
            fi
            if [ "$(date -d "$ELIGIBLE_AT" +%s)" -gt "$(date -u +%s)" ]; then
              keep_cleanup "$ITEM"
              continue
            fi

            JOB_FILE="$CLEANUP_ROOT/jobs/$JOB_ID.json"
            if ! npx wrangler r2 object get "yg-webgis-public-snapshots/drone/jobs/$JOB_ID.json" --remote --file "$JOB_FILE"; then
              keep_cleanup "$ITEM"
              continue
            fi
            if [ "$(jq -r '.status // empty' "$JOB_FILE")" != "ready" ] || [ -z "$(jq -r '.cogKey // empty' "$JOB_FILE")" ]; then
              keep_cleanup "$ITEM"
              continue
            fi
            if [ "$(jq -r '.r2CleanupStatus // empty' "$JOB_FILE")" = "complete" ]; then
              continue
            fi

            JOB_TOKEN=$(jq -r '.accessToken // empty' "$JOB_FILE")
            if [ -z "$JOB_TOKEN" ] || ! curl --fail --silent --show-error --head \
              -H "x-job-token: $JOB_TOKEN" \
              "$DRONE_API_BASE/api/drone/jobs/$JOB_ID/cog" >/dev/null; then
              echo "Keeping R2 source for $JOB_ID because the remote COG could not be verified"
              keep_cleanup "$ITEM"
              continue
            fi

            CLEANUP_FAILED=0
            while IFS= read -r KEY; do
              [ -z "$KEY" ] && continue
              if [[ "$KEY" != "drone/uploads/$JOB_ID/"* ]]; then
                echo "Skipping unexpected source key: $KEY"
                continue
              fi
              if ! npx wrangler r2 object delete "yg-webgis-public-snapshots/$KEY" --remote; then
                CLEANUP_FAILED=1
              fi
            done < <(jq -r '.files[]?.key // empty' "$JOB_FILE")

            CACHE_PREFIX="drone/cache/$JOB_ID"
            CACHE_MANIFEST="$CLEANUP_ROOT/jobs/$JOB_ID-cache.json"
            if npx wrangler r2 object get "yg-webgis-public-snapshots/$CACHE_PREFIX/manifest.json" --remote --file "$CACHE_MANIFEST" >/dev/null 2>&1; then
              while IFS= read -r PART; do
                [ -z "$PART" ] && continue
                if ! npx wrangler r2 object delete "yg-webgis-public-snapshots/$CACHE_PREFIX/$PART" --remote; then
                  CLEANUP_FAILED=1
                fi
              done < <(jq -r '.parts[]? // empty' "$CACHE_MANIFEST")
              if ! npx wrangler r2 object delete "yg-webgis-public-snapshots/$CACHE_PREFIX/manifest.json" --remote; then
                CLEANUP_FAILED=1
              fi
            fi

            if [ "$CLEANUP_FAILED" -ne 0 ]; then
              echo "R2 source cleanup incomplete for $JOB_ID; retrying on the next schedule"
              keep_cleanup "$ITEM"
              continue
            fi

            python ../../scripts/drone_job.py cleanup-complete "$JOB_FILE"
            npx wrangler r2 object put "yg-webgis-public-snapshots/drone/jobs/$JOB_ID.json" --remote --file "$JOB_FILE" --content-type application/json
            echo "Cleaned temporary R2 source for verified result $JOB_ID"
          done < <(jq -c '.jobs[]?' "$CLEANUP_QUEUE")

          jq --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.updatedAt=$now' "$CLEANUP_NEXT" > "$CLEANUP_NEXT.tmp"
          mv "$CLEANUP_NEXT.tmp" "$CLEANUP_NEXT"
          if ! npx wrangler r2 object put "yg-webgis-public-snapshots/drone/queue/cleanup.json" --remote --file "$CLEANUP_NEXT" --content-type application/json; then
            echo "Warning: cleanup queue could not be updated; source files will be preserved"
          fi
      - name: Read pending queue
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p ../../tmp/drone
          npx wrangler r2 object get "yg-webgis-public-snapshots/drone/queue/pending.json" --remote --file ../../tmp/drone/pending.json || echo '{"jobs":[]}' > ../../tmp/drone/pending.json
          cat ../../tmp/drone/pending.json
      - name: Process first pending job
        id: process_job
        shell: bash
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          JOB_ID=$(jq -r '.jobs[0] // empty' ../../tmp/drone/pending.json)
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          if [ -z "$JOB_ID" ]; then
            echo "No pending drone jobs"
            exit 0
          fi
          ROOT="../../tmp/drone/$JOB_ID"
          mkdir -p "$ROOT/input" "$ROOT/output" "$ROOT/project/images" "$ROOT/rejected"
          npx wrangler r2 object get "yg-webgis-public-snapshots/drone/jobs/$JOB_ID.json" --remote --file "$ROOT/job.json"

          RETRY_AFTER=$(jq -r '.retryAfter // empty' "$ROOT/job.json")
          if [ -n "$RETRY_AFTER" ] && [ "$(date -d "$RETRY_AFTER" +%s)" -gt "$(date -u +%s)" ]; then
            echo "Drive checkpoint is cooling down until $RETRY_AFTER"
            exit 0
          fi

          publish_status() {
            npx wrangler r2 object put "yg-webgis-public-snapshots/drone/jobs/$JOB_ID.json" --remote --file "$ROOT/job.json" --content-type application/json
          }

          # A refinement request only needs to clean the existing COG. Re-running
          # the full photogrammetry pipeline would needlessly download/process all
          # source photos again and can leave the UI waiting for hours.
          REFINE_REQUESTED=$(jq -r '.refineRequestedAt // empty' "$ROOT/job.json")
          COG_KEY=$(jq -r '.cogKey // empty' "$ROOT/job.json")
          if [ -n "$REFINE_REQUESTED" ] && [ -n "$COG_KEY" ]; then
            python ../../scripts/drone_job.py stage "$ROOT/job.json" optimizing 90 "Membersihkan latar hasil"
            publish_status

            npx wrangler r2 object get "yg-webgis-public-snapshots/$COG_KEY" --remote --file "$ROOT/output/orthomosaic-current.cog.tif"
            nearblack -setalpha -near 20 -nb 5 -alg floodfill \
              -o "$ROOT/output/orthomosaic-refined.tif" "$ROOT/output/orthomosaic-current.cog.tif"
            gdal_translate "$ROOT/output/orthomosaic-refined.tif" "$ROOT/output/orthomosaic.cog.tif" \
              -b 1 -b 2 -b 3 -mask 4 \
              -of COG -co COMPRESS=JPEG -co QUALITY=90 -co BIGTIFF=IF_SAFER -co OVERVIEWS=AUTO
            gdalinfo -json "$ROOT/output/orthomosaic.cog.tif" > "$ROOT/output/gdalinfo.json"
            npx wrangler r2 object put "yg-webgis-public-snapshots/$COG_KEY" --remote --file "$ROOT/output/orthomosaic.cog.tif" --content-type image/tiff

            python ../../scripts/drone_job.py refine-ready "$ROOT/job.json" "$ROOT/output/gdalinfo.json"
            python ../../scripts/drone_job.py cleanup-scheduled "$ROOT/job.json" --days 7
            publish_status
            CLEANUP_QUEUE="$ROOT/cleanup.json"
            CLEANUP_NEXT="$ROOT/cleanup.next.json"
            npx wrangler r2 object get "yg-webgis-public-snapshots/drone/queue/cleanup.json" --remote --file "$CLEANUP_QUEUE" || echo '{"jobs":[]}' > "$CLEANUP_QUEUE"
            CLEANUP_AT=$(jq -r '.r2CleanupEligibleAt' "$ROOT/job.json")
            jq --arg id "$JOB_ID" --arg eligibleAt "$CLEANUP_AT" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '.jobs = ((.jobs // []) | map(select(.id != $id)) + [{id:$id,eligibleAt:$eligibleAt}]) | .updatedAt=$now' \
              "$CLEANUP_QUEUE" > "$CLEANUP_NEXT"
            npx wrangler r2 object put "yg-webgis-public-snapshots/drone/queue/cleanup.json" --remote --file "$CLEANUP_NEXT" --content-type application/json
            jq --arg id "$JOB_ID" '.jobs = (.jobs | map(select(. != $id)))' ../../tmp/drone/pending.json > ../../tmp/drone/pending.next.json
            mv ../../tmp/drone/pending.next.json ../../tmp/drone/pending.json
            npx wrangler r2 object put "yg-webgis-public-snapshots/drone/queue/pending.json" --remote --file ../../tmp/drone/pending.json --content-type application/json
            echo "Refined existing orthomosaic without rebuilding source photos"
            exit 0
          fi

          python ../../scripts/drone_job.py processing "$ROOT/job.json"
          publish_status

          python ../../scripts/drone_job.py stage "$ROOT/job.json" downloading 15 "Mengambil foto"
          publish_status
          SOURCE=$(jq -r '.sourceType' "$ROOT/job.json")
          if [ "$SOURCE" = "drive" ]; then
            CACHE_PREFIX="drone/cache/$JOB_ID"
            CACHE_KEY="$CACHE_PREFIX/source.tar"
            CACHE_MANIFEST_KEY="$CACHE_PREFIX/manifest.json"
            CACHE_FILE="$ROOT/source.tar"
            CACHE_MANIFEST="$ROOT/cache-manifest.json"
            if npx wrangler r2 object get "yg-webgis-public-snapshots/$CACHE_MANIFEST_KEY" --remote --file "$CACHE_MANIFEST" >/dev/null 2>&1; then
              python ../../scripts/drone_job.py stage "$ROOT/job.json" downloading 17 "Memuat checkpoint foto"
              publish_status
              while IFS= read -r PART; do
                [ -z "$PART" ] && continue
                npx wrangler r2 object get "yg-webgis-public-snapshots/$CACHE_PREFIX/$PART" --remote --file "$ROOT/$PART"
              done < <(jq -r '.parts[]' "$CACHE_MANIFEST")
              cat "$ROOT"/source.tar.part-* > "$CACHE_FILE"
              tar -xf "$CACHE_FILE" -C "$ROOT/input"
              DOWNLOADED=$(find "$ROOT/input" -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) | wc -l | tr -d ' ')
              EXPECTED=$(jq -r '.expectedPhotos // .downloadedPhotos // 0' "$ROOT/job.json")
              [ "$EXPECTED" -le 0 ] && EXPECTED="$DOWNLOADED"
              python ../../scripts/drone_job.py stage "$ROOT/job.json" downloading 18 "Melanjutkan foto $DOWNLOADED/$EXPECTED" --downloaded "$DOWNLOADED" --expected "$EXPECTED"
              publish_status
            elif npx wrangler r2 object get "yg-webgis-public-snapshots/$CACHE_KEY" --remote --file "$CACHE_FILE" >/dev/null 2>&1; then
              python ../../scripts/drone_job.py stage "$ROOT/job.json" downloading 17 "Memuat checkpoint foto"
              publish_status
              tar -xf "$CACHE_FILE" -C "$ROOT/input"
              DOWNLOADED=$(find "$ROOT/input" -type f \( -iname '*.jpg' -o -iname '*.jpeg' \) | wc -l | tr -d ' ')
              EXPECTED=$(jq -r '.expectedPhotos // .downloadedPhotos // 0' "$ROOT/job.json")
              [ "$EXPECTED" -le 0 ] && EXPECTED="$DOWNLOADED"
              python ../../scripts/drone_job.py stage "$ROOT/job.json" downloading 18 "Melanjutkan foto $DOWNLOADED/$EXPECTED" --downloaded "$DOWNLOADED" --expected "$EXPECTED"
              publish_status
            fi

            DRIVE_URL=$(jq -r '.driveUrl' "$ROOT/job.json")
            set +e
            python ../../scripts/download_drive_folder.py "$DRIVE_URL" "$ROOT/input" "$ROOT/drive-download.json" --passes 1 --retries 2 --timeout 60 --progress-interval 5 &
            DOWNLOAD_PID=$!
            LAST_COUNT=-1
            while kill -0 "$DOWNLOAD_PID" 2>/dev/null; do
              if [ -f "$ROOT/drive-download.json" ]; then
                EXPECTED=$(jq -r '.expectedPhotos // 0' "$ROOT/drive-download.json")
                DOWNLOADED=$(jq -r '.downloadedPhotos // 0' "$ROOT/drive-download.json")
                if [ "$EXPECTED" -gt 0 ] && [ "$DOWNLOADED" -ne "$LAST_COUNT" ]; then
                  PROGRESS=$((15 + (DOWNLOADED * 14 / EXPECTED)))
                  [ "$PROGRESS" -gt 29 ] && PROGRESS=29
                  python ../../scripts/drone_job.py stage "$ROOT/job.json" downloading "$PROGRESS" "Mengambil foto $DOWNLOADED/$EXPECTED" --downloaded "$DOWNLOADED" --expected "$EXPECTED"
                  publish_status
                  LAST_COUNT=$DOWNLOADED
                fi
              fi
              sleep 8
            done
            wait "$DOWNLOAD_PID"
            DOWNLOAD_RC=$?
            set -e
            EXPECTED=$(jq -r '.expectedPhotos // 0' "$ROOT/drive-download.json")
            DOWNLOADED=$(jq -r '.downloadedPhotos // 0' "$ROOT/drive-download.json")

            tar -cf "$CACHE_FILE" -C "$ROOT/input" .
            split -b 240M -d -a 3 "$CACHE_FILE" "$ROOT/source.tar.part-"
            PARTS=$(find "$ROOT" -maxdepth 1 -type f -name 'source.tar.part-*' -printf '%f\n' | sort | jq -R . | jq -s .)
            jq -n --argjson parts "$PARTS" --argjson downloaded "$DOWNLOADED" --argjson expected "$EXPECTED" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{version:1,parts:$parts,downloadedPhotos:$downloaded,expectedPhotos:$expected,updatedAt:$now}' > "$CACHE_MANIFEST"
            while IFS= read -r PART; do
              [ -z "$PART" ] && continue
              npx wrangler r2 object put "yg-webgis-public-snapshots/$CACHE_PREFIX/$PART" --remote --file "$ROOT/$PART" --content-type application/octet-stream
            done < <(jq -r '.parts[]' "$CACHE_MANIFEST")
            npx wrangler r2 object put "yg-webgis-public-snapshots/$CACHE_MANIFEST_KEY" --remote --file "$CACHE_MANIFEST" --content-type application/json

            if [ "$DOWNLOAD_RC" -ne 0 ]; then
              python ../../scripts/drone_job.py checkpoint "$ROOT/job.json" --downloaded "$DOWNLOADED" --expected "$EXPECTED" --retry-minutes 30
              publish_status
              echo "Saved Drive checkpoint $DOWNLOADED/$EXPECTED; keeping job queued"
              exit 0
            fi

            python ../../scripts/drone_job.py stage "$ROOT/job.json" downloading 29 "Foto diterima $DOWNLOADED/$EXPECTED" --downloaded "$DOWNLOADED" --expected "$EXPECTED"
            publish_status
          else
            TOTAL=$(jq -r '.files | length' "$ROOT/job.json")
            INDEX=0
            jq -r '.files[]?.key' "$ROOT/job.json" | while read -r KEY; do
              [ -z "$KEY" ] && continue
              NAME=$(basename "$KEY")
              npx wrangler r2 object get "yg-webgis-public-snapshots/$KEY" --remote --file "$ROOT/input/$NAME"
              INDEX=$((INDEX+1))
            done
          fi

          python ../../scripts/drone_job.py stage "$ROOT/job.json" checking 30 "Memeriksa kualitas dan metadata foto"
          publish_status
          python ../../scripts/drone_job.py qc "$ROOT/input" "$ROOT/rejected" "$ROOT/valid.txt" "$ROOT/qc.json"
          python ../../scripts/drone_job.py metadata "$ROOT/job.json" "$ROOT/qc.json"
          publish_status
          VALID=$(jq -r '.validPhotos' "$ROOT/qc.json")
          REJECTED=$(jq -r '.excludedPhotos' "$ROOT/qc.json")
          if [ "$VALID" -lt 3 ]; then
            echo "insufficient_valid_photos" > "$ROOT/error_code"
            exit 22
          fi

          python ../../scripts/drone_job.py stage "$ROOT/job.json" preparing 45 "Menyiapkan foto terpilih" --valid "$VALID" --excluded "$REJECTED"
          publish_status
          while IFS= read -r IMG; do cp "$IMG" "$ROOT/project/images/"; done < "$ROOT/valid.txt"

          python ../../scripts/drone_job.py stage "$ROOT/job.json" reconstructing 55 "Menyusun posisi dan kecocokan foto" --valid "$VALID" --excluded "$REJECTED"
          publish_status
          docker pull opendronemap/odm:latest
          if ! docker run --rm -v "$(realpath "$ROOT"):/datasets" opendronemap/odm:latest \
            --project-path /datasets project \
            --orthophoto-resolution 3 \
            --feature-quality medium \
            --pc-quality medium \
            --crop 1 \
            --orthophoto-cutline \
            --skip-3dmodel \
            --skip-report; then
            echo "photogrammetry_failed" > "$ROOT/error_code"
            exit 24
          fi

          TIF="$ROOT/project/odm_orthophoto/odm_orthophoto.tif"
          if [ ! -f "$TIF" ]; then
            echo "orthomosaic_not_created" > "$ROOT/error_code"
            exit 23
          fi

          python ../../scripts/drone_job.py stage "$ROOT/job.json" orthomosaic 80 "Membuat orthomosaic" --valid "$VALID" --excluded "$REJECTED"
          publish_status

          python ../../scripts/drone_job.py stage "$ROOT/job.json" optimizing 90 "Menyiapkan hasil untuk peta" --valid "$VALID" --excluded "$REJECTED"
          publish_status
          # Rapikan tepi: ubah area hitam di luar hasil menjadi transparan.
          # nearblack hanya membersihkan area gelap yang terhubung ke tepi raster.
          nearblack -setalpha -near 20 -nb 5 -alg floodfill -o "$ROOT/output/orthomosaic-clean.tif" "$TIF"

          # Simpan RGB + alpha sebagai mask agar COG JPEG tetap ringan tetapi background transparan.
          gdal_translate "$ROOT/output/orthomosaic-clean.tif" "$ROOT/output/orthomosaic.cog.tif" \
            -b 1 -b 2 -b 3 -mask 4 \
            -of COG -co COMPRESS=JPEG -co QUALITY=90 -co BIGTIFF=IF_SAFER -co OVERVIEWS=AUTO
          gdalinfo -json "$ROOT/output/orthomosaic.cog.tif" > "$ROOT/output/gdalinfo.json"

          python ../../scripts/drone_job.py stage "$ROOT/job.json" saving 95 "Menyimpan hasil" --valid "$VALID" --excluded "$REJECTED"
          publish_status
          npx wrangler r2 object put "yg-webgis-public-snapshots/drone/results/$JOB_ID/orthomosaic.cog.tif" --remote --file "$ROOT/output/orthomosaic.cog.tif" --content-type image/tiff

          python ../../scripts/drone_job.py ready "$ROOT/job.json" "$ROOT/output/gdalinfo.json" "$ROOT/qc.json"
          python ../../scripts/drone_job.py cleanup-scheduled "$ROOT/job.json" --days 7
          publish_status

          CLEANUP_QUEUE="$ROOT/cleanup.json"
          CLEANUP_NEXT="$ROOT/cleanup.next.json"
          npx wrangler r2 object get "yg-webgis-public-snapshots/drone/queue/cleanup.json" --remote --file "$CLEANUP_QUEUE" || echo '{"jobs":[]}' > "$CLEANUP_QUEUE"
          CLEANUP_AT=$(jq -r '.r2CleanupEligibleAt' "$ROOT/job.json")
          jq --arg id "$JOB_ID" --arg eligibleAt "$CLEANUP_AT" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.jobs = ((.jobs // []) | map(select(.id != $id)) + [{id:$id,eligibleAt:$eligibleAt}]) | .updatedAt=$now' \
            "$CLEANUP_QUEUE" > "$CLEANUP_NEXT"
          if ! npx wrangler r2 object put "yg-webgis-public-snapshots/drone/queue/cleanup.json" --remote --file "$CLEANUP_NEXT" --content-type application/json; then
            echo "Warning: cleanup scheduling failed; preserving the ready result and its source files"
          fi

          jq --arg id "$JOB_ID" '.jobs = (.jobs | map(select(. != $id)))' ../../tmp/drone/pending.json > ../../tmp/drone/pending.next.json
          mv ../../tmp/drone/pending.next.json ../../tmp/drone/pending.json
          npx wrangler r2 object put "yg-webgis-public-snapshots/drone/queue/pending.json" --remote --file ../../tmp/drone/pending.json --content-type application/json
      - name: Mark failed job
        if: failure() && steps.process_job.outputs.job_id != ''
        shell: bash
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          JOB_ID: ${{ steps.process_job.outputs.job_id }}
        run: |
          ROOT="../../tmp/drone/$JOB_ID"
          if [ -f "$ROOT/job.json" ]; then
            ERROR_CODE="processing_failed"
            [ -f "$ROOT/error_code" ] && ERROR_CODE=$(cat "$ROOT/error_code")
            python ../../scripts/drone_job.py failed "$ROOT/job.json" --error "$ERROR_CODE"
            npx wrangler r2 object put "yg-webgis-public-snapshots/drone/jobs/$JOB_ID.json" --remote --file "$ROOT/job.json" --content-type application/json || true
          fi
          if [ -f ../../tmp/drone/pending.json ]; then
            jq --arg id "$JOB_ID" '.jobs = (.jobs | map(select(. != $id)))' ../../tmp/drone/pending.json > ../../tmp/drone/pending.next.json || true
