name: Inspect existing Dayun GeoTIFF
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/inspect-dayun-geotiff.yml'
      - 'scripts/*dayun*.py'
      - 'scripts/download_drive_geotiff.py'
      - 'tests/test_dayun*.py'
      - 'tests/test_drive_geotiff.py'
  workflow_dispatch:
    inputs:
      source:
        description: 'Process queued staff links or rerun an existing source'
        type: choice
        options: [queued, both, Agro_ABC, Agro_DEF]
        default: queued
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: yg-webgis-staging
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        label: [Agro_ABC, Agro_DEF]
    concurrency:
      group: dayun-source-${{ matrix.label }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: cloudflare/yg-webgis-public-data
      - name: Install raster tools
        run: pip install 'rasterio>=1.4,<2' 'Pillow>=11,<13' 'shapely>=2,<3' 'pyproj>=3,<4' 'google-auth[requests]>=2,<3'
      - name: Verify engine
        run: |
          python -m unittest discover -s tests -p test_drive_geotiff.py -v
          python -m unittest discover -s tests -p 'test_dayun*.py' -v
      - name: Connect existing Drive reader without a JSON key
        if: vars.DAYUN_GOOGLE_WIF_PROVIDER != ''
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          project_id: yg-staff-dashboard
          workload_identity_provider: ${{ vars.DAYUN_GOOGLE_WIF_PROVIDER }}
          service_account: webgisyg-dayun-reader@yg-staff-dashboard.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true
      - name: Verify private R2
        run: python scripts/verify_dayun_r2_privacy.py
      - name: Process staff link requests with the existing engine
        env:
          DRIVE_CREDENTIALS_JSON: ${{ secrets.DRIVE_CREDENTIALS_JSON }}
          SOURCE_LABEL: ${{ matrix.label }}
          SOURCE_MODE: ${{ inputs.source || 'queued' }}
          ANALYSIS_RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/process_dayun_analysis_requests.py --label "$SOURCE_LABEL" --run "$ANALYSIS_RUN" --mode "$SOURCE_MODE"
      # Imagery, crop tables, credentials and request records stay out of Actions artifacts.
