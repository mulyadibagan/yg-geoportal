name: Remove public PBPH history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply the reviewed public-data policy
        shell: bash
        env:
          CLEANUP_POLICY_ARCHIVE: 
        run: |
          printf '%s' "$CLEANUP_POLICY_ARCHIVE" | base64 --decode | tar -xzf -
      - name: Find public branches carrying PBPH history
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          marker='a979856840e5c97000f5f076553d81c509ba741c'
          git for-each-ref --format='%(refname:strip=3)' --contains="$marker" refs/remotes/origin \
            | grep -Ev '^(HEAD|main)$' > /tmp/pbph-branches.txt || true
          echo "Branches scheduled for removal:"
          sed 's/^/  - /' /tmp/pbph-branches.txt
      - name: Remove PBPH data from the public snapshot
        shell: bash
        run: |
          node scripts/sanitize-public-pbph.mjs .
          rm -f data/PBPH_RIAU_052026.geojson
          rm -f data/pbph-documents.json
          rm -rf data/phl-svlk-monthly
          rm -f docs/pbph-profile-integration.md
          rm -f scripts/archive_phl_svlk_monthly.mjs
          rm -f scripts/validate_pbph_documents.mjs
          node scripts/assert-repository-pbph-data-private.mjs
      - name: Replace main with a clean root commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          tree="$(git write-tree)"
          commit="$(printf '%s\n' 'Rebuild public history without PBPH data' | git commit-tree "$tree")"
          git push --force origin "$commit:refs/heads/main"
          echo "CLEAN_COMMIT=$commit" >> "$GITHUB_ENV"
      - name: Remove branches retaining the old PBPH commits
        shell: bash
        run: |
          while IFS= read -r branch; do
            [ -n "$branch" ] || continue
            git push origin --delete "$branch"
          done < /tmp/pbph-branches.txt
          echo "Clean main: $CLEAN_COMMIT"
