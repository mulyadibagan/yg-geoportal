name: Refine current drone orthomosaic once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enqueue:
    runs-on: ubuntu-latest
    environment: yg-webgis-staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/yg-webgis-public-data/package-lock.json
      - run: npm ci
        working-directory: cloudflare/yg-webgis-public-data
      - name: Queue refinement
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          JOB_ID: drn-ea81d7d4-19be-4ee7-9e68-6f1306c7a302
        run: |
          set -euo pipefail
          mkdir -p ../../tmp/drone
          JOB="../../tmp/drone/job.json"
          QUEUE="../../tmp/drone/pending.json"
          npx wrangler r2 object get "yg-webgis-public-snapshots/drone/jobs/$JOB_ID.json" --remote --file "$JOB"
          STATUS=$(jq -r '.status // empty' "$JOB")
          if [ "$STATUS" != "ready" ] && [ "$STATUS" != "failed" ]; then
            echo "Current job is active (status=$STATUS); refusing to enqueue it twice."
            exit 1
          fi
          JOB_TOKEN=$(jq -r '.accessToken // empty' "$JOB")
          test -n "$JOB_TOKEN"
          echo "::add-mask::$JOB_TOKEN"
          ACTION=refine
          [ "$STATUS" = "failed" ] && ACTION=retry
          curl --fail --silent --show-error -X POST \
            -H 'Origin: https://webgisyg.id' -H "x-job-token: $JOB_TOKEN" \
            "https://yg-webgis-public-data.yg-webgis-public-data-worker.workers.dev/api/drone/jobs/$JOB_ID/$ACTION" \
            -o ../../tmp/drone/refine-response.json
          jq '{ok,job:(.job|{id,status,stage,progress})}' ../../tmp/drone/refine-response.json
