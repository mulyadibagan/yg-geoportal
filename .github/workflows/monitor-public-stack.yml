name: Monitor public data stack

on:
  workflow_dispatch:
  schedule:
    - cron: '37 */3 * * *'

permissions:
  contents: read

concurrency:
  group: yg-webgis-public-stack-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node scripts/monitor-public-stack.mjs
