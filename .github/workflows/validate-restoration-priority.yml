name: Validate internal restoration priority

on:
  pull_request:
    paths:
      - index.html
      - js/navigation-v2.js
      - restoration-priority.html
      - staff-riau-reference.html
      - js/restoration-*.js
      - css/restoration-priority.css
      - data/restoration-priority-sources.json
      - tests/restoration-*.test.cjs
      - scripts/check-restoration-inputs.mjs
      - scripts/prepare-restoration-sources.mjs
      - scripts/reconcile-restoration-evidence.mjs
      - scripts/extract-restoration-tree-loss.mjs
      - scripts/acquire-restoration-gfc.mjs
      - scripts/acquire-restoration-big-reference.mjs
      - scripts/compare-restoration-big-reference.mjs
      - scripts/acquire-restoration-tmat.mjs
      - scripts/audit-restoration-tmat.mjs
      - scripts/acquire-restoration-research-peat.mjs
      - scripts/validate-restoration-database-evidence.mjs
      - scripts/audit-restoration-bpbd.mjs
      - scripts/diagnose-restoration-geometry.mjs
      - scripts/extract-restoration-research-tmat.py
      - scripts/validate-restoration-ring-candidates.mjs
      - scripts/acquire-restoration-canals.mjs
      - scripts/extract-restoration-canal-evidence.mjs
      - scripts/prepare-restoration-three-pressure-evidence.mjs
      - scripts/review-restoration-three-pressure-candidates.mjs
      - scripts/sample-restoration-candidate-loss.mjs
      - scripts/review-restoration-canal-pixels.mjs
      - scripts/acquire-restoration-jrc-forest.mjs
      - scripts/review-restoration-four-unit-forest.mjs
      - scripts/prepare-restoration-site-review.mjs
      - scripts/*restoration-brg*.mjs
      - .github/workflows/validate-restoration-priority.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check scripts
        run: |
          node --check js/restoration-priority.js
          for script in scripts/*restoration-brg*.mjs js/restoration-review.js; do node --check "$script"; done
          node --check js/restoration-scoring.js
          node --check js/restoration-catalog.js
          node --check js/restoration-inventory.js
          node --check scripts/check-restoration-inputs.mjs
          node --check scripts/prepare-restoration-sources.mjs
          node --check scripts/reconcile-restoration-evidence.mjs
          node --check scripts/extract-restoration-tree-loss.mjs
          node --check scripts/acquire-restoration-gfc.mjs
          node --check scripts/acquire-restoration-big-reference.mjs
          node --check scripts/compare-restoration-big-reference.mjs
          node --check scripts/acquire-restoration-tmat.mjs
          node --check scripts/audit-restoration-tmat.mjs
          node --check scripts/acquire-restoration-research-peat.mjs
          node --check scripts/validate-restoration-database-evidence.mjs
          node --check scripts/audit-restoration-bpbd.mjs
          node --check scripts/diagnose-restoration-geometry.mjs
          node --check scripts/validate-restoration-ring-candidates.mjs
          node --check scripts/acquire-restoration-canals.mjs
          node --check scripts/extract-restoration-canal-evidence.mjs
          node --check scripts/prepare-restoration-three-pressure-evidence.mjs
          node --check scripts/review-restoration-three-pressure-candidates.mjs
          node --check scripts/sample-restoration-candidate-loss.mjs
          node --check scripts/review-restoration-canal-pixels.mjs
          node --check scripts/acquire-restoration-jrc-forest.mjs
          node --check scripts/review-restoration-four-unit-forest.mjs
          node --check scripts/prepare-restoration-site-review.mjs
          python3 -c "from pathlib import Path; p=Path('scripts/extract-restoration-research-tmat.py'); compile(p.read_text(encoding='utf-8'), str(p), 'exec')"
      - name: Prepare isolated existing GIS library versions
        run: npm install --prefix private-data/restoration-runtime --no-save --ignore-scripts --no-audit --no-fund @turf/turf@7.2.0 geotiff@2.1.3 jsts@2.7.1
      - name: Test scoring, access and existing reference workspace
        run: node --test tests/restoration-*.test.cjs tests/riau-geoportal-internal.test.cjs tests/riau-reference-workspace.test.cjs tests/riau-reference-loading.test.cjs
