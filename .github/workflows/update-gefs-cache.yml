name: Update GEFS transport cache

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_gefs_cache.mjs"
      - "scripts/validate_gefs_cache.mjs"
      - "scripts/update_weather_cache.mjs"
      - "scripts/validate_weather_cache.mjs"
      - "scripts/update_gfs_atmosphere_cache.mjs"
      - "scripts/validate_gfs_atmosphere_cache.mjs"
      - "scripts/update_cams_air_quality_cache.mjs"
      - "scripts/validate_cams_air_quality_cache.mjs"
      - "scripts/update_surface_observations_cache.mjs"
      - "scripts/validate_surface_observations_cache.mjs"
      - ".github/workflows/update-gefs-cache.yml"
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-gefs-cache
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Fetch GEFS 925 hPa ensemble
        run: node scripts/update_gefs_cache.mjs
      - name: Validate GEFS provenance and coverage
        run: node scripts/validate_gefs_cache.mjs
      - name: Fetch deterministic GFS atmosphere cache
        run: node scripts/update_gfs_atmosphere_cache.mjs
      - name: Validate deterministic GFS atmosphere cache
        run: node scripts/validate_gfs_atmosphere_cache.mjs
      - name: Fetch cached Riau weather
        run: node scripts/update_weather_cache.mjs
      - name: Validate cached Riau weather
        run: node scripts/validate_weather_cache.mjs
      - name: Fetch national CAMS air-quality cache
        run: node scripts/update_cams_air_quality_cache.mjs
      - name: Validate national CAMS air-quality cache
        run: node scripts/validate_cams_air_quality_cache.mjs
      - name: Fetch Indonesian surface observations
        run: node scripts/update_surface_observations_cache.mjs
      - name: Validate Indonesian surface observations
        run: node scripts/validate_surface_observations_cache.mjs
      - name: Commit refreshed cache
        run: |
          if git diff --quiet -- data/gefs-multilevel.json data/gfs-atmosphere.json data/weather-riau.json data/cams-air-quality.json data/surface-observations.json; then
            echo "GEFS, atmosphere, weather, and CAMS caches are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gefs-multilevel.json data/gfs-atmosphere.json data/weather-riau.json data/cams-air-quality.json data/surface-observations.json
          git commit -m "chore(data): update transport and weather caches"
          git push
