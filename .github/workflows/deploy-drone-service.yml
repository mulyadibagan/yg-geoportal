name: Deploy Drone Survey service

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/yg-webgis-public-data/src/drone*.js'
      - '.github/workflows/deploy-drone-service.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: yg-webgis-staging
    concurrency:
      group: yg-webgis-worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/yg-webgis-public-data/package-lock.json
      - run: npm ci
        working-directory: cloudflare/yg-webgis-public-data
      - run: npm test
        working-directory: cloudflare/yg-webgis-public-data
      - name: Deploy service without rebuilding public snapshots
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env staging
          npx wrangler deploy --env production
      - name: Check production service
        run: |
          curl --fail --silent --show-error https://webgis-api.yayasangambut.org/api/drone/public > /tmp/drone-public.json
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/drone-public.json'));if(!d.ok||!Array.isArray(d.items))process.exit(1);console.log('Drone public catalogue available');"
