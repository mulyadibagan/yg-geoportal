name: Update Master Database snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: master-database-snapshot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update-master-database-snapshot.py
      - name: Commit refreshed public snapshots
        run: |
          if git diff --quiet -- data/master-database-snapshot.json data/dashboard-summary-snapshot.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master-database-snapshot.json data/dashboard-summary-snapshot.json
          git commit -m "Update public data snapshots"
          git push
