name: Publish private staff social forestry data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-staff-social-forestry.yml'
      - 'cloudflare/yg-webgis-public-data/src/index.js'
      - 'js/staff-data-access.js'
      - 'staff-social-forestry-directory.html'
      - 'staff-social-forestry-profile.html'
      - 'js/staff-social-forestry-*.js'

permissions:
  contents: read

env:
  PS_GEOMETRY_SOURCE_COMMIT: b3397aefedd81181cada381ef85dc285d81626f8
  PS_DETAILS_SOURCE_COMMIT: 691b2be2aa467d144ae7e2600d84ef1b39523a6d

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: yg-webgis-staging
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build private PS payloads
        shell: bash
        run: |
          mkdir -p /tmp/yg-private
          git show "${PS_GEOMETRY_SOURCE_COMMIT}:data/PERHUTANAN_SOSIAL_RIAU.geojson" > /tmp/yg-private/social-forestry-base.geojson
          git show "${PS_DETAILS_SOURCE_COMMIT}:data/social-forestry-details.json" > /tmp/yg-private/social-forestry-details.json
          for file in social-forestry-pkk-samj.geojson social-forestry-kud-agro-lestari.geojson social-forestry-derived-2025.geojson social-forestry-official-2026.geojson; do
            git show "${PS_DETAILS_SOURCE_COMMIT}:data/${file}" > "/tmp/yg-private/${file}"
          done
          node - <<'NODE'
          const fs=require('fs');
          const names=['social-forestry-base.geojson','social-forestry-pkk-samj.geojson','social-forestry-kud-agro-lestari.geojson','social-forestry-derived-2025.geojson','social-forestry-official-2026.geojson'];
          const features=names.flatMap(name=>(JSON.parse(fs.readFileSync('/tmp/yg-private/'+name,'utf8')).features||[]));
          if(!features.length) throw new Error('PS private geometry is empty');
          fs.writeFileSync('/tmp/yg-private/social-forestry-riau.geojson',JSON.stringify({type:'FeatureCollection',features}));
          const details=JSON.parse(fs.readFileSync('/tmp/yg-private/social-forestry-details.json','utf8'));
          if(!Object.keys(details).length) throw new Error('PS private details are empty');
          console.log('PS features:',features.length,'detail profiles:',Object.keys(details).length);
          NODE
      - name: Validate access wiring
        shell: bash
        run: |
          grep -q "/api/staff/social-forestry-details" js/staff-data-access.js
          grep -q "internal/social-forestry/details.json" cloudflare/yg-webgis-public-data/src/index.js
          grep -q "staff-social-forestry-gate.js" staff-social-forestry-directory.html
          grep -q "staff-social-forestry-gate.js" staff-social-forestry-profile.html
          node --check js/staff-social-forestry-directory.js
          node --check js/staff-social-forestry-profile.js
          node --check cloudflare/yg-webgis-public-data/src/index.js
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/yg-webgis-public-data/package-lock.json
      - run: npm ci
        working-directory: cloudflare/yg-webgis-public-data
      - name: Upload private PS data
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for bucket in yg-webgis-public-snapshots-staging yg-webgis-public-snapshots; do
            npx wrangler r2 object put "${bucket}/internal/social-forestry/riau.geojson" --remote --file /tmp/yg-private/social-forestry-riau.geojson --content-type application/geo+json
            npx wrangler r2 object put "${bucket}/internal/social-forestry/details.json" --remote --file /tmp/yg-private/social-forestry-details.json --content-type application/json
          done
      - name: Deploy protected staff routes
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env staging
          npx wrangler deploy --env production
