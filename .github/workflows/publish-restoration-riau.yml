name: Publish internal Riau restoration analysis

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - internal-data/restoration-riau/payload.json.enc
      - scripts/decrypt-restoration-riau.mjs
      - .github/workflows/publish-restoration-riau.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: yg-webgis-staging
    concurrency:
      group: yg-webgis-worker-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/yg-webgis-public-data/package-lock.json
      - name: Validate and decrypt internal data
        env:
          RESTORATION_RIAU_PAYLOAD_KEY: ${{ secrets.RESTORATION_RIAU_PAYLOAD_KEY }}
        run: node scripts/decrypt-restoration-riau.mjs internal-data/restoration-riau/payload.json.enc "$RUNNER_TEMP/riau-dashboard.json"
      - run: npm ci
        working-directory: cloudflare/yg-webgis-public-data
      - run: npm test
        working-directory: cloudflare/yg-webgis-public-data
      - name: Store analysis behind existing staff access
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for bucket in yg-webgis-public-snapshots-staging yg-webgis-public-snapshots; do
            api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${bucket}/domains"
            curl --fail --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/managed" > "$RUNNER_TEMP/domains-managed.json"
            curl --fail --silent --show-error --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${api}/custom" > "$RUNNER_TEMP/domains-custom.json"
            jq -e '.success == true and (.result | type == "object") and .result.enabled == false' "$RUNNER_TEMP/domains-managed.json"
            jq -e '.success == true and (.result.domains | type == "array") and all(.result.domains[]; .enabled == false)' "$RUNNER_TEMP/domains-custom.json"
            npx wrangler r2 object put "${bucket}/internal/restoration/riau-dashboard-v1.json" --remote --file "$RUNNER_TEMP/riau-dashboard.json" --content-type 'application/json' --cache-control 'private, no-store'
          done
          npx wrangler deploy --env staging
          npx wrangler deploy --env production
      - name: Verify anonymous access stays blocked
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://webgis-api.yayasangambut.org/api/staff/restoration-riau-dashboard')
          test "$status" = 401 -o "$status" = 403
      - name: Remove decrypted temporary file
        if: always()
        run: rm -f "$RUNNER_TEMP/riau-dashboard.json"
