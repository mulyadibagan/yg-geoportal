name: Ingest internal RTRW Riau

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ingest-internal-rtrw-riau.yml
      - cloudflare/yg-webgis-public-data/package.json
      - cloudflare/yg-webgis-public-data/package-lock.json
      - cloudflare/yg-webgis-public-data/scripts/prepare-rtrw-riau.mjs
      - cloudflare/yg-webgis-public-data/scripts/build-rdtr-bagansiapiapi-analysis.mjs
      - cloudflare/yg-webgis-public-data/scripts/fetch-rdtr-bagansiapiapi-osm-evidence.mjs
      - cloudflare/yg-webgis-public-data/scripts/validate-rtrw.mjs
      - cloudflare/yg-webgis-public-data/test/rtrw-ingest.test.mjs
      - data/batas_administrasi_desa_riau.geojson
      - data/Gambut_BBSDLP_2019.geojson
      - data/kawasan_hutan_sk_903.geojson
      - data/mangrove-priority-rokan-hilir-results.json
      - data/mangrove-priority-rokan-hilir-candidates.geojson
      - data/mangrove-priority-rokan-hilir-roads-osm.geojson
  workflow_dispatch:
    inputs:
      upload_production:
        description: Upload the verified layer to the production R2 bucket
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: yg-webgis-rtrw-riau-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: yg-webgis-staging
    env:
      SOURCE_URL: https://kspservices.big.go.id/satupeta/rest/services/PUBLIK/PERENCANAAN_RUANG/MapServer/14
      DISPLAY_KEY: internal/spatial-planning/rtrw-riau-2018-2038.geojson
      RAW_KEY: internal/spatial-planning/source/rtrw-riau-2018-2038-raw.geojson
      MANIFEST_KEY: internal/spatial-planning/rtrw-riau-2018-2038-manifest.json
      RDTR_ANALYSIS_KEY: internal/spatial-planning/rdtr-bagansiapiapi-analysis.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/yg-webgis-public-data/package-lock.json

      - run: npm ci
        working-directory: cloudflare/yg-webgis-public-data

      - name: Download official KSP BIG geometry
        shell: bash
        run: |
          curl --fail --show-error --silent --retry 3 \
            --connect-timeout 30 --max-time 600 --get \
            "${SOURCE_URL}/query" \
            --data-urlencode "where=UPPER(wadmpr)='RIAU'" \
            --data-urlencode "outFields=*" \
            --data-urlencode "returnGeometry=true" \
            --data-urlencode "outSR=4326" \
            --data-urlencode "f=geojson" \
            --output "${RUNNER_TEMP}/rtrw-riau-raw.geojson"

      - name: Build verified display geometry
        shell: bash
        working-directory: cloudflare/yg-webgis-public-data
        run: |
          npx mapshaper-xl "${RUNNER_TEMP}/rtrw-riau-raw.geojson" \
            -simplify weighted 5% keep-shapes \
            -clean \
            -o format=geojson precision=0.000001 \
            "${RUNNER_TEMP}/rtrw-riau-simplified.geojson"
          node scripts/prepare-rtrw-riau.mjs \
            "${RUNNER_TEMP}/rtrw-riau-raw.geojson" \
            "${RUNNER_TEMP}/rtrw-riau-simplified.geojson" \
            "${RUNNER_TEMP}/rtrw-riau-display.geojson" \
            "${RUNNER_TEMP}/rtrw-riau-manifest.json"
          npm run validate:rtrw -- "${RUNNER_TEMP}/rtrw-riau-display.geojson"

      - name: Build internal Bagansiapiapi RDTR baseline
        shell: bash
        working-directory: cloudflare/yg-webgis-public-data
        run: |
          node scripts/fetch-rdtr-bagansiapiapi-osm-evidence.mjs \
            "${GITHUB_WORKSPACE}/data/rdtr-bagansiapiapi-facilities-osm.geojson" \
            "${GITHUB_WORKSPACE}/data/rdtr-bagansiapiapi-hydrology-osm.geojson"
          node scripts/build-rdtr-bagansiapiapi-analysis.mjs \
            "${RUNNER_TEMP}/rtrw-riau-display.geojson" \
            "${RUNNER_TEMP}/rdtr-bagansiapiapi-analysis.json"
          node -e '
            const data = require(process.argv[1]);
            if (data.metadata?.access !== "staff_only") throw Error("RDTR analysis must remain staff-only");
            if (data.summary?.villageCount !== 11) throw Error("Expected 11 planning-area villages");
            if (data.metadata?.ygDraftZoningStatus !== "provisional_internal_zone_geometry") throw Error("YG draft zoning is missing");
            if (!data.map?.ygCandidateZones?.features?.length) throw Error("Expected YG candidate zone geometries");
            if ((data.map?.ygCandidateZones?.metadata?.coveragePct || 0) < 99) throw Error("YG candidate zones do not cover the study area");
            if (data.map?.ygStructureNodes?.features?.length !== 11) throw Error("Expected 11 YG analytical structure nodes");
            if (data.map?.ygStructureAxes?.features?.length !== 10) throw Error("Expected 10 YG analytical connectivity axes");
            if (data.ygDraftRdtr?.version !== "0.28.0-internal-release-candidate") throw Error("Expected YG RDTR draft v0.28");
            if (!data.map?.ygRoadEvidence?.features?.length) throw Error("Expected intersecting OSM road evidence");
            if (data.ygDraftRdtr?.networkEvidence?.status !== "partial_open_road_evidence") throw Error("Expected partial open road evidence status");
            if (!data.map?.ygFacilityEvidence?.features?.length) throw Error("Expected intersecting OSM facility evidence");
            if (!data.map?.ygHydrologyEvidence?.features?.length) throw Error("Expected intersecting OSM hydrology evidence");
            if (data.ygDraftRdtr?.serviceHydrologyEvidence?.status !== "partial_open_evidence") throw Error("Expected partial facility/hydrology evidence status");
            if (data.serviceAccessAnalysis?.villageMatrix?.length !== 11) throw Error("Expected service-access evidence matrix for 11 villages");
            if (data.serviceAccessAnalysis?.villageMatrix?.some(row => !String(row.serviceAdequacy || "").startsWith("not_assessed"))) throw Error("Service adequacy must remain unassessed without population and capacity evidence");
            if (data.map?.ygDevelopmentReadiness?.features?.length !== data.map?.ygCandidateZones?.features?.length) throw Error("Every YG zone must have a development-readiness evidence lock");
            if (data.map?.ygDevelopmentReadiness?.features?.some(feature => feature.properties?.developmentReadiness !== "not_determined" || feature.properties?.safeForIntensification !== "not_demonstrated")) throw Error("No zone may be promoted as safe without complete hazard evidence");
            if (data.ygPlan?.programs?.items?.length !== 8) throw Error("Expected eight candidate RDTR programme packages");
            if (data.ygPlan?.programs?.items?.some(row => row.financingStatus !== "not_costed_not_committed" || !row.indicators?.length || row.indicators.some(indicator => indicator.baseline !== null || indicator.target !== null))) throw Error("Programmes must not fabricate costs, baselines, or targets");
            if (data.consultationArgumentMatrix?.items?.length !== 10) throw Error("Expected ten regulation-linked consultation arguments");
            if (data.consultationArgumentMatrix?.items?.some(row => row.governmentResponse !== null || row.agreedChange !== null || row.responsibleParty !== null || row.dueDate !== null || row.resolutionStatus !== "not_started")) throw Error("Consultation outcomes must remain empty until evidence is received");
            if (data.consultationReadinessPack?.priorityAgenda?.length !== 10 || data.consultationReadinessPack?.mapChecklist?.length !== 7 || data.consultationReadinessPack?.teamRoles?.length !== 5) throw Error("Consultation readiness pack is incomplete");
            if (data.consultationReadinessPack?.teamRoles?.some(row => row.assignedTo !== null) || data.consultationReadinessPack?.noteTemplate?.some(row => row.respondentNameAndRole !== null || row.responseVerbatimOrSummary !== null || row.resolutionStatus !== "not_started")) throw Error("Consultation assignments and notes must not be fabricated");
            if (data.completenessAudit?.items?.length !== 18 || data.completenessAudit?.status !== "not_ready_for_legal_or_public_release") throw Error("RDTR completeness audit is missing or overclaims readiness");
            if (data.completenessAudit?.items?.some(row => row.legalCompleteness !== "not_complete" || row.publicationEligible !== false) || data.completenessAudit?.releaseGates?.some(row => row.status !== "not_completed")) throw Error("No component or release gate may be marked complete before final review");
            if (data.policyMapFramework?.status !== "mapped_policy_synthesis_v0") throw Error("Policy synthesis map is missing");
            if (!data.map?.mangroveCandidates?.features?.length) throw Error("Expected mapped mangrove policy candidates");
          ' "${RUNNER_TEMP}/rdtr-bagansiapiapi-analysis.json"

      - name: Run Worker and ingest tests
        run: npm test
        working-directory: cloudflare/yg-webgis-public-data

      - name: Upload verified internal layer to staging R2
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put \
            "yg-webgis-public-snapshots-staging/${DISPLAY_KEY}" --remote \
            --file "${RUNNER_TEMP}/rtrw-riau-display.geojson" \
            --content-type application/geo+json
          npx wrangler r2 object put \
            "yg-webgis-public-snapshots-staging/${RAW_KEY}" --remote \
            --file "${RUNNER_TEMP}/rtrw-riau-raw.geojson" \
            --content-type application/geo+json
          npx wrangler r2 object put \
            "yg-webgis-public-snapshots-staging/${MANIFEST_KEY}" --remote \
            --file "${RUNNER_TEMP}/rtrw-riau-manifest.json" \
            --content-type application/json
          npx wrangler r2 object put \
            "yg-webgis-public-snapshots-staging/${RDTR_ANALYSIS_KEY}" --remote \
            --file "${RUNNER_TEMP}/rdtr-bagansiapiapi-analysis.json" \
            --content-type application/json

      - name: Upload verified internal layer to production R2
        if: ${{ github.event_name == 'push' || inputs.upload_production }}
        working-directory: cloudflare/yg-webgis-public-data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 object put \
            "yg-webgis-public-snapshots/${DISPLAY_KEY}" --remote \
            --file "${RUNNER_TEMP}/rtrw-riau-display.geojson" \
            --content-type application/geo+json
          npx wrangler r2 object put \
            "yg-webgis-public-snapshots/${RAW_KEY}" --remote \
            --file "${RUNNER_TEMP}/rtrw-riau-raw.geojson" \
            --content-type application/geo+json
          npx wrangler r2 object put \
            "yg-webgis-public-snapshots/${MANIFEST_KEY}" --remote \
            --file "${RUNNER_TEMP}/rtrw-riau-manifest.json" \
            --content-type application/json
          npx wrangler r2 object put \
            "yg-webgis-public-snapshots/${RDTR_ANALYSIS_KEY}" --remote \
            --file "${RUNNER_TEMP}/rdtr-bagansiapiapi-analysis.json" \
            --content-type application/json

      - name: Verify private gateway remains closed anonymously
        shell: bash
        run: |
          for base in \
            "https://yg-webgis-public-data-staging.yg-webgis-public-data-worker.workers.dev" \
            "https://yg-webgis-public-data.yg-webgis-public-data-worker.workers.dev"
          do
            status="$(curl --show-error --silent --output /dev/null \
              --write-out '%{http_code}' \
              "${base}/api/staff/rtrw-riau-2018-2038")"
            test "${status}" = "401"
          done
