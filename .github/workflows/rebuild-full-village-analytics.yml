name: Rebuild Full Village Analytics

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: village-analytics-main
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild all administrative-village analytics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy rasterio shapely pyproj

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build forest analytics and reference intersections
        env:
          FOREST_VILLAGE_GEOJSON: data/batas_administrasi_desa_riau.geojson
          FOREST_ANALYTICS_OUTPUT: data/administrative-village-analytics.json
          FOREST_INCLUDE_SOCIAL_FORESTRY: "0"
          FOREST_INCLUDE_LEGACY_GAIN: "0"
          FOREST_GROUP_VILLAGE_PARTS: "1"
        run: |
          python scripts/build_forest_analytics.py
          python scripts/build_reference_intersections.py

      - name: Add five-year FIRMS hotspot history
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FIRMS_MODE: history
          FIRMS_SOURCES: MODIS_SP,VIIRS_SNPP_SP,VIIRS_NOAA20_SP
          FIRMS_START_YEAR: "2021"
          FIRMS_CHUNK_DAYS: "5"
          FIRMS_VILLAGE_GEOJSON: data/batas_administrasi_desa_riau.geojson
          FIRMS_ANALYTICS_OUTPUT: data/administrative-village-analytics.json
          FIRMS_INCLUDE_SOCIAL_FORESTRY: "0"
        run: node scripts/update_hotspot_firms.mjs

      - name: Add recent FIRMS hotspots
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FIRMS_MODE: recent
          FIRMS_SOURCES: VIIRS_SNPP_NRT
          FIRMS_CHUNK_DAYS: "5"
          FIRMS_VILLAGE_GEOJSON: data/batas_administrasi_desa_riau.geojson
          FIRMS_ANALYTICS_OUTPUT: data/administrative-village-analytics.json
          FIRMS_INCLUDE_SOCIAL_FORESTRY: "0"
        run: |
          node scripts/update_hotspot_firms.mjs
          python scripts/enrich_hotspot_landcover.py

      - name: Split analytics for on-demand browser loading
        run: node scripts/shard_administrative_village_analytics.mjs

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- data/administrative-village-analytics data/administrative-village-analytics.json)" ]; then
            echo "No analytics changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/administrative-village-analytics data/administrative-village-analytics.json
          git commit -m "chore(data): rebuild full village analytics"
          git pull --rebase origin main
          git push origin HEAD:main
