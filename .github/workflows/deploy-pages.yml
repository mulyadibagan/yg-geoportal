name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - Update GEFS transport cache
      - Update Hotspot Analytics
      - Update Hotspot History
      - Update Master Database snapshot
      - Rebuild Full Village Analytics
      - Rebuild Social Forestry Summary
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A failed upstream workflow still emits workflow_run. Keep that skipped run
  # from cancelling a valid push deployment already in progress.
  group: pages-${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && 'skipped' || 'deploy' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        shell: bash
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.codex-worktrees/' \
            --exclude '.tablet-preview/' \
            --exclude 'apps-script/' \
            --exclude 'docs/' \
            --exclude 'scripts/' \
            --exclude 'private-data/' \
            --exclude 'internal-data/' \
            --exclude 'data/riau-geoportal/' \
            --exclude 'cloudflare/yg-webgis-public-data/tmp/' \
            --exclude 'data/kph_2019_riau.geojson' \
            --exclude 'data/PBPH_RIAU_052026.geojson' \
            --exclude 'data/pbph-documents.json' \
            --exclude 'data/PERHUTANAN_SOSIAL_RIAU.geojson' \
            --exclude 'data/social-forestry-pkk-samj.geojson' \
            --exclude 'data/social-forestry-kud-agro-lestari.geojson' \
            --exclude 'data/social-forestry-derived-2025.geojson' \
            --exclude 'data/social-forestry-official-2026.geojson' \
            --exclude 'data/phl-svlk-monthly/' \
            --exclude '_site/' \
            ./ _site/
          export DAYUN_UPDATED_AT="$(git log -1 --format=%cI -- data/dayun-gawangan-details.json)"
          node -e "const fs=require('fs');const path='_site/data/dayun-gawangan-details.json';const data=JSON.parse(fs.readFileSync(path,'utf8'));data.updatedAt=process.env.DAYUN_UPDATED_AT;fs.writeFileSync(path,JSON.stringify(data,null,2)+'\\n');"
          node scripts/sanitize-public-pbph.mjs _site
          node scripts/assert-public-pbph-private.mjs _site
          node scripts/assert-repository-pbph-data-private.mjs
          node scripts/assert-riau-geoportal-private.mjs .
          node scripts/assert-riau-geoportal-private.mjs _site
          node --test tests/staff-auth.test.cjs
          node --test tests/riau-reference-workspace.test.cjs tests/riau-geoportal-internal.test.cjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy site
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
