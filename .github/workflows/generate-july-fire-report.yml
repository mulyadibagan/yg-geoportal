name: Generate Monthly Riau Fire Report

on:
  schedule:
    - cron: "30 3 2 * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-july-fire-report.yml"
      - "scripts/recover_fire_monthly_archive.py"
  workflow_dispatch:
    inputs:
      month:
        description: "Month to finalize (YYYY-MM); blank uses previous month"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: fire-monthly-report-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Recover complete closed-month archive
        id: period
        env:
          REQUESTED_MONTH: ${{ inputs.month }}
        run: |
          month="${REQUESTED_MONTH:-$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)}"
          echo "month=$month" >> "$GITHUB_OUTPUT"
          python scripts/recover_fire_monthly_archive.py --month "$month" --output "tmp/fire-monthly/${month}.geojson"
      - name: Generate final monthly report and index
        run: |
          node scripts/generate_fire_monthly_report.mjs --month "${{ steps.period.outputs.month }}" --geojson-archive "tmp/fire-monthly/${{ steps.period.outputs.month }}.geojson"
          node scripts/build_fire_monthly_index.mjs
          node scripts/build_fire_profile_annual.mjs
      - name: Publish report snapshot
        run: |
          month="${{ steps.period.outputs.month }}"
          cp "data/fire-monthly/${month}.json" "/tmp/${month}.json"
          if git cat-file -e "HEAD:data/fire-monthly/${month}.json" 2>/dev/null; then
            git restore "data/fire-monthly/${month}.json"
          else
            rm "data/fire-monthly/${month}.json"
          fi
          git restore data/fire-monthly/index.json data/fire-monthly/profile-annual.json
          git pull --rebase origin main
          mkdir -p data/fire-monthly
          cp "/tmp/${month}.json" "data/fire-monthly/${month}.json"
          node scripts/build_fire_monthly_index.mjs
          node scripts/build_fire_profile_annual.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/fire-monthly/${month}.json" data/fire-monthly/index.json data/fire-monthly/profile-annual.json
          git diff --cached --quiet && exit 0
          git commit -m "data: publish ${month} Riau fire report"
          git push origin HEAD:main
