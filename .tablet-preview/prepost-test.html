<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pre/Post Test Capacity Building | YG GeoPortal</title>
  <link rel="stylesheet" href="css/prepost-test.css?v=20260725-3">
</head>
<body>
  <main class="test-shell">
    <header class="test-header">
      <span class="badge">Capacity Building</span>
      <h1 id="session-title">Memuat sesi...</h1>
      <p id="session-meta">Silakan tunggu, data sesi sedang dimuat.</p>
    </header>

    <section class="test-card">
      <h2>Identitas Peserta</h2>
      <div class="test-grid">
        <label>Nama peserta *
          <input id="participant-name" type="text" placeholder="Wajib diisi">
        </label>
        <label>Email peserta
          <input id="participant-email" type="email" placeholder="Opsional">
        </label>
        <label>Jenis kelamin *
          <select id="participant-gender">
            <option value="">Pilih</option>
            <option value="Perempuan">Perempuan</option>
            <option value="Laki-Laki">Laki-Laki</option>
          </select>
        </label>
        <label>Kategori umur
          <select id="participant-age-category">
            <option value="">Pilih</option>
            <option value="<18 Tahun">&lt;18 Tahun</option>
            <option value="18-25 Tahun">18-25 Tahun</option>
            <option value="26-35 Tahun">26-35 Tahun</option>
            <option value="35-45 Tahun">35-45 Tahun</option>
            <option value="45-55 Tahun">45-55 Tahun</option>
            <option value=">55 Tahun">&gt;55 Tahun</option>
          </select>
        </label>
        <label>Utusan lembaga
          <select id="participant-delegate">
            <option value="">Pilih</option>
            <option value="Kelompok Tani">Kelompok Tani</option>
            <option value="Kelompok Perhutanan Sosial">Kelompok Perhutanan Sosial</option>
            <option value="Masyarakat Desa">Masyarakat Desa</option>
            <option value="Pemerintah Desa">Pemerintah Desa</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </label>
        <label id="participant-delegate-custom-wrap" style="display:none">Utusan lembaga (isi manual)
          <input id="participant-delegate-custom" type="text" placeholder="Contoh: Karang Taruna Desa X">
        </label>
      </div>
    </section>

    <section class="test-card">
      <h2>Pertanyaan</h2>
      <div id="question-list" class="question-list">
        <p class="loading">Memuat pertanyaan...</p>
      </div>
    </section>

    <section class="test-card test-actions">
      <button id="submit-test" type="button">Kirim Jawaban</button>
      <p id="submit-status">Pastikan semua jawaban terisi sebelum mengirim.</p>
    </section>
  </main>

  <script src="js/prepost-test.js?v=20260725-3"></script>
</body>
</html>
