<h1>Data GIS Dayun</h1><p>Titik nanas dan buah Blok A–C, batas tanaman baru, batas horti, dan batas gawangan. Data dibaca dari revisi privat terbaru. Ekspor tidak mengubah data.</p>

'use strict';
const $=id=>document.getElementById(id),enc=new TextEncoder();
const fc=features=>({type:'FeatureCollection',features});
function expand(raw,block){if(raw.type==='FeatureCollection')return raw.features;if(raw.schema!=='dayun-review-grid-v1')throw Error('Format kandidat tidak didukung');const [a,b,c,d,e,f]=raw.transform;return raw.points.map(([x,y,z])=>({type:'Feature',geometry:{type:'Point',coordinates:[a*(x+.5)+c,e*(y+.5)+f]},properties:{id:`${block}-radial-x${x}-y${y}`,zones:z.map(i=>raw.zones[i]),status:'candidate',origin:'automated'}}));}

function rings(g){const parts=g.type==='Polygon'?g.coordinates:g.coordinates.flat();const polys=g.type==='Polygon'?[g.coordinates]:g.coordinates;return polys.flatMap(p=>p.map((r,i)=>{const a=r.map(c=>c.slice(0,2));if(a[0][0]!==a.at(-1)[0]||a[0][1]!==a.at(-1)[1])a.push([...a[0]]);const signed=a.slice(1).reduce((s,c,j)=>s+(c[0]-a[j][0])*(c[1]+a[j][1]),0);if((i===0&&signed<0)||(i>0&&signed>0))a.reverse();return a;}));}
const fields=[['id',100],['block',3],['zones',240],['status',24],['origin',48],['name',140],['source',140],['revision',16],['plant_id',100],['counted',8],['estimated',8],['note',200]];
function dbf(features){const header=32+32*fields.length+1,record=1+fields.reduce((n,f)=>n+f[1],0),bytes=new Uint8Array(header+record*features.length+1),v=new DataView(bytes.buffer),now=new Date();bytes[0]=3;bytes[1]=now.getUTCFullYear()-1900;bytes[2]=now.getUTCMonth()+1;bytes[3]=now.getUTCDate();v.setUint32(4,features.length,true);v.setUint16(8,header,true);v.setUint16(10,record,true);fields.forEach(([name,len],i)=>{const o=32+i*32;bytes.set(enc.encode(name),o);bytes[o+11]=67;bytes[o+16]=len;});bytes[header-1]=13;features.forEach((f,i)=>{let o=header+i*record;bytes.fill(32,o,o+record);o++;fields.forEach(([name,len])=>{let s=f.properties?.[name]??'';if(Array.isArray(s))s=s.join(';');if(typeof s==='object')s=JSON.stringify(s);let t=enc.encode(String(s));if(t.length>len){let end=len;while(end>0&&(t[end]&192)===128)end--;t=t.slice(0,end);}bytes.set(t,o);o+=len;});});bytes[bytes.length-1]=26;return bytes;}
function shp(features,type){const records=features.map(f=>{if(type===1){const b=new Uint8Array(20),v=new DataView(b.buffer);v.setInt32(0,1,true);v.setFloat64(4,f.geometry.coordinates[0],true);v.setFloat64(12,f.geometry.coordinates[1],true);return b;}const rs=rings(f.geometry),points=rs.flat(),box=bounds(points),b=new Uint8Array(44+4*rs.length+16*points.length),v=new DataView(b.buffer);v.setInt32(0,5,true);box.forEach((x,i)=>v.setFloat64(4+8*i,x,true));v.setInt32(36,rs.length,true);v.setInt32(40,points.length,true);let count=0;rs.forEach((r,i)=>{v.setInt32(44+4*i,count,true);count+=r.length;});points.forEach((p,i)=>{v.setFloat64(44+4*rs.length+16*i,p[0],true);v.setFloat64(52+4*rs.length+16*i,p[1],true);});return b;});const all=features.flatMap(f=>type===1?[f.geometry.coordinates]:rings(f.geometry).flat()),box=all.length?bounds(all):[0,0,0,0];function head(length){const b=new Uint8Array(100),v=new DataView(b.buffer);v.setInt32(0,9994);v.setInt32(24,length/2);v.setInt32(28,1000,true);v.setInt32(32,type,true);box.forEach((x,i)=>v.setFloat64(36+8*i,x,true));return b;}const total=100+records.reduce((n,b)=>n+b.length+8,0),out=new Uint8Array(total),index=new Uint8Array(100+8*records.length);out.set(head(total));index.set(head(index.length));let o=100;records.forEach((r,i)=>{const v=new DataView(out.buffer),iv=new DataView(index.buffer);v.setInt32(o,i+1);v.setInt32(o+4,r.length/2);iv.setInt32(100+8*i,o/2);iv.setInt32(104+8*i,r.length/2);out.set(r,o+8);o+=r.length+8;});return[out,index];}
const prj='GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",SPHEROID["WGS_1984",6378137,298.257223563]],PRIMEM["Greenwich",0],UNIT["Degree",0.0174532925199433]]';
const crcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0;});
function crc(data){let c=0xffffffff;for(const x of data)c=crcTable[(c^x)&255]^(c>>>8);return(c^0xffffffff)>>>0;}
async function zip(files){let offset=0;const chunks=[],central=[];for(const [name,input]of Object.entries(files)){const data=typeof input==='string'?enc.encode(input):input,packed=new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()),n=enc.encode(name),c=crc(data),h=new Uint8Array(30+n.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,2048,true);v.setUint16(8,8,true);v.setUint32(14,c,true);v.setUint32(18,packed.length,true);v.setUint32(22,data.length,true);v.setUint16(26,n.length,true);h.set(n,30);chunks.push(h,packed);const d=new Uint8Array(46+n.length),w=new DataView(d.buffer);w.setUint32(0,0x02014b50,true);w.setUint16(4,20,true);w.setUint16(6,20,true);w.setUint16(8,2048,true);w.setUint16(10,8,true);w.setUint32(16,c,true);w.setUint32(20,packed.length,true);w.setUint32(24,data.length,true);w.setUint16(28,n.length,true);w.setUint32(42,offset,true);d.set(n,46);central.push(d);offset+=h.length+packed.length;}const size=central.reduce((n,b)=>n+b.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,central.length,true);v.setUint16(10,central.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);const out=new Uint8Array(offset+size+22);let o=0;for(const b of [...chunks,...central,end]){out.set(b,o);o+=b.length;}return out;}
function layer(files,name,features,type){if(features.some(f=>!f.geometry||!(type===1?f.geometry.type==='Point':['Polygon','MultiPolygon'].includes(f.geometry.type))))throw Error('Geometri tidak sesuai '+name);const [a,b]=shp(features,type);files[name+'/'+name+'.shp']=a;files[name+'/'+name+'.shx']=b;files[name+'/'+name+'.dbf']=dbf(features);files[name+'/'+name+'.prj']=prj;files[name+'/'+name+'.cpg']='UTF-8';}
let exportBlobURL;
function clearPrivateExport(){const s=window.YG_AUTH?.readStoredSession();if(!s||s.expiresAt<=Date.now()){if(exportBlobURL)URL.revokeObjectURL(exportBlobURL);exportBlobURL=null;$('exportData').value='';$('result').replaceChildren();}}
window.addEventListener('storage',clearPrivateExport);setInterval(clearPrivateExport,5000);
$('load').onclick=async()=>{const session=window.YG_AUTH?.readStoredSession();if(!session||session.expiresAt<=Date.now()){$('status').textContent='Silakan masuk sebagai staf terlebih dahulu.';return;}$('load').disabled=true;$('result').replaceChildren();$('exportData').value='';
try{const get=async path=>{if(window.YG_AUTH?.readStoredSession()?.token!==session.token)throw Error('Sesi berubah');const r=await fetch('https://webgis-api.yayasangambut.org'+path,{headers:{Authorization:'Bearer '+session.token},cache:'no-store',signal:AbortSignal.timeout(90000)});if(!r.ok)throw Error(path+': HTTP '+r.status);return r.json();};
const base='/api/staff/drone/analysis/Agro_ABC',manifest=await get(base),plants=[],fruits=[],estimates=[],newBounds=[],horti=[],gawangan=[],audit=[];
for(const block of ['A','B','C']){$('status').textContent='Membaca titik nanas dan buah Blok '+block+'…';const path=manifest.block_analyses?.[block];if(!path||!manifest.files.includes(path))throw Error('Analisis '+block+' tidak tersedia');const analysis=await get(base+'/files/'+path),folder=path.slice(0,path.lastIndexOf('/')+1),asset=analysis.asset_folder||'';const file=name=>{const p=manifest.files.includes(folder+name)?folder+name:asset+name;if(!manifest.files.includes(p))throw Error('Aset belum tersedia: '+name);return get(base+'/files/'+p);};const candidates=expand(await file('candidates.geojson'),block),head=await get(base+'/block-review?block='+block);if(head.analysis_path!==path||head.review&&(head.review.source_run!==manifest.run||head.review.analysis_path!==path))throw Error('Revisi sumber berubah '+block);const map=new Map(candidates.map(f=>[f.properties.id,{...f,properties:{...f.properties,status:'candidate',origin:'automated'}}]));for(const f of head.review?.changes||[])map.set(f.properties.id,f);const active=[...map.values()].filter(f=>f.properties.status!=='rejected');if(head.counts&&active.length!==head.counts.working_total)throw Error('Jumlah titik tidak cocok '+block);plants.push(...active.map(f=>({...f,properties:{...f.properties,block,revision:head.revision,estimated:/estimate|census/i.test((f.properties.origin||'')+' '+f.properties.id)||/\[Penyesuaian sensus/i.test(f.properties.note||'')?'yes':'no'}})));const fruit=await get(base+'/fruiting-review?block='+block);if(fruit.source_run!==manifest.run||fruit.block!==block)throw Error('Sumber buah berubah '+block);const fs=fruit.features.filter(f=>f.properties.origin==='manual_fruiting_review'&&f.properties.status!=='rejected');fruits.push(...fs.map(f=>({...f,properties:{...f.properties,block,revision:fruit.revision}})));const zones=await file('zones.geojson');gawangan.push(...zones.features.map(f=>({...f,properties:{...f.properties,block}})));audit.push({block,plant_revision:head.revision,fruit_revision:fruit.revision,plants:active.length,fruits:fs.length,analysis_path:path,run:manifest.run});}
$('status').textContent='Membaca seluruh batas tanaman baru dan horti…';let cursor=null;const items=[];do{const d=await get('/api/staff/drone/analysis/areas'+(cursor?'?cursor='+encodeURIComponent(cursor):''));items.push(...d.items);cursor=d.cursor;}while(cursor);
for(const item of items){if(!/\bhorti\b|nanas baru|tanaman baru|perkiraan sensus/i.test(item.name))continue;const {record}=await get('/api/staff/drone/analysis/areas?id='+encodeURIComponent(item.id));for(const f of record.collection.features){const p=f.properties||{},common={...p,id:p.id||item.id,zones:p.zones||(p.zoneId?[p.zoneId]:[]),name:p.name||item.name,source:item.name,revision:record.revision};if(/perkiraan sensus/i.test(item.name)){for(const [i,c]of(p.estimatedCoordinates||[]).entries())estimates.push({type:'Feature',geometry:{type:'Point',coordinates:c},properties:{id:'estimate-'+p.zoneId+'-'+(i+1),zones:[p.zoneId],block:p.zoneId?.split('-')[1],origin:'census_position_estimate',estimated:'yes',revision:record.revision,source:item.name,status:'estimated'}});continue;}if(!['Polygon','MultiPolygon'].includes(f.geometry?.type))continue;(/\bhorti\b/i.test(item.name)?horti:newBounds).push({...f,properties:common});}}

const files={},layers=[['titik_nanas',plants,1],['titik_nanas_citra_tim',plants.filter(f=>f.properties.estimated!=='yes'),1],['titik_buah',fruits,1],['batas_nanas_baru',newBounds,5],['batas_horti',horti,5],['batas_gawangan',gawangan,5]];if(estimates.length)layers.push(['titik_perkiraan_sensus',estimates,1]);for(const [name,features,type]of layers)layer(files,name,features,type);
files['metadata.json']=JSON.stringify({exported_at:new Date().toISOString(),crs:'EPSG:4326',audit,layers:layers.map(([name,f])=>({name,count:f.length})),notes:['Titik nenas kerja: kandidat otomatis + koreksi tim terbaru, titik ditolak dikecualikan. Bukan sensus terverifikasi.','Titik buah termasuk penanda aktif yang belum dihubungkan dan duplikat; status, counted, plant_id tersedia. Hitung buah unik menurut plant_id dan counted, bukan jumlah baris.','Layer titik_nanas memuat penyesuaian sensus: estimated=yes. Layer titik_nanas_citra_tim mengecualikan posisi model. Titik perkiraan sensus tersimpan terpisah; bukan hasil deteksi citra. Tidak digunakan menyimpulkan tanaman hidup atau celah sulam.','Batas tanaman baru memuat semua kelompok batas tersimpan; beberapa sumber dapat bertumpang tindih. Kolom source mempertahankan asal batas.','Shapefile WGS84 derajat, UTF-8. Buka .shp bersama .shx .dbf .prj .cpg.','Koordinat tidak digeser atau diubah. Draf sulam tidak disertakan.']},null,2);
files['BACA_SAYA.txt']='DATA GIS DAYUN\nCRS EPSG:4326 (WGS84), UTF-8. Ekstrak ZIP, buka .shp di QGIS/ArcGIS.\nTitik nenas adalah hitungan kerja, bukan semua tanaman terverifikasi. Perkiraan sensus disimpan terpisah. Titik tanpa hasil deteksi belum tentu tanaman hilang.\nLihat metadata.json untuk jumlah dan revisi tiap blok. Batas tanaman baru bisa saling tumpang tindih; periksa atribut source.\n';
$('status').textContent='Menyusun Shapefile ZIP…';const bytes=await zip(files),blob=new Blob([bytes],{type:'application/zip'});if(exportBlobURL)URL.revokeObjectURL(exportBlobURL);exportBlobURL=URL.createObjectURL(blob);const link=document.createElement('a');link.href=exportBlobURL;link.download='Data_GIS_Dayun_24_Oktober_2026.zip';link.textContent='Unduh Data GIS Dayun (.zip)';$('result').append(link);const table=document.createElement('table');for(const [name,f]of layers){const tr=document.createElement('tr');for(const s of[name,String(f.length)]){const td=document.createElement('td');td.textContent=s;tr.append(td);}table.append(tr);}$('result').append(table);let binary='';for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));$('exportData').value=btoa(binary);$('status').textContent='Siap. Seluruh layer dibaca dari backend; tidak ada data yang diubah.';
}catch(e){$('status').textContent='Ekspor belum selesai: '+e.message;}finally{$('load').disabled=false;}};
